services:
  claimledger-studio:
    build: .
    ports:
      - "4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      CLAIMLEDGER_PROVIDER: heuristic-only
      CLAIMLEDGER_PRIVACY_MODE: heuristic_only
      CLAIMLEDGER_DATA_DIR: /data
    volumes:
      - ./.local/container-data:/data
      # Optional: mount local secrets for remote providers without baking them into the image.
      # - ./.local/secrets.env:/app/.local/secrets.env:ro
